---
- name: Check whether the Tailscale package is already present
  ansible.builtin.command: tailscale version
  register: tailscale_version
  changed_when: false
  failed_when: false

- name: Download the Tailscale bootstrap installer
  ansible.builtin.get_url:
    url: https://tailscale.com/install.sh
    dest: /tmp/tailscale_install.sh
    mode: "0755"
    owner: root
    group: root
  when: tailscale_version.rc != 0

- name: Install Tailscale client
  ansible.builtin.command:
    cmd: >-
      /tmp/tailscale_install.sh
  no_log: true
  changed_when: true
  when: tailscale_version.rc != 0

- name: Remove the temporary Tailscale installer script
  ansible.builtin.file:
    path: /tmp/tailscale_install.sh
    state: absent

- name: Ensure the tailscaled service is enabled and running
  ansible.builtin.systemd:
    name: tailscaled
    enabled: true
    state: started

- name: Check current Tailscale connection state
  ansible.builtin.command: tailscale status --json
  register: tailscale_status
  changed_when: false
  failed_when: false

- name: Determine whether enrollment is required
  ansible.builtin.set_fact:
    tailscale_needs_enrollment: >-
      {{
        tailscale_status.rc != 0 or
        (tailscale_status.stdout | from_json).BackendState != 'Running'
      }}

- name: Write the Headscale pre-auth key to a transient, root-only file
  ansible.builtin.copy:
    content: "{{ headscale_preauthkey }}"
    dest: "{{ tailscale_authkey_file }}"
    mode: "0600"
    owner: root
    group: root
  no_log: true
  when: tailscale_needs_enrollment

- name: Enroll node into the Headscale VPN server
  ansible.builtin.command:
    cmd: >-
      tailscale up
      --login-server {{ headscale_login_server }}
      --authkey file:{{ tailscale_authkey_file }}
  no_log: true
  changed_when: true
  when: tailscale_needs_enrollment

- name: Remove the transient pre-auth key file
  ansible.builtin.file:
    path: "{{ tailscale_authkey_file }}"
    state: absent

- name: Gather installed package facts
  ansible.builtin.package_facts:
    manager: auto

- name: Download the HTCondor bootstrap installer
  ansible.builtin.get_url:
    url: https://get.htcondor.org
    dest: /tmp/get_htcondor.sh
    mode: "0755"
    owner: root
    group: root
  when: "'condor' not in ansible_facts.packages"

- name: Install HTCondor as an execute node
  ansible.builtin.command:
    cmd: >-
      /tmp/get_htcondor.sh --no-dry-run --channel stable --execute "{{ htcondor_cm_external_ip }}"
      --password "{{ htcondor_password }}"
  no_log: true
  changed_when: true
  when: "'condor' not in ansible_facts.packages"

- name: Remove the temporary installer script
  ansible.builtin.file:
    path: /tmp/get_htcondor.sh
    state: absent

- name: Ensure the condor service is enabled and started
  ansible.builtin.systemd:
    name: condor
    enabled: true
    state: started
